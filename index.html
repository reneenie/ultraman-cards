<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>奥特曼卡片</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* 布局：一屏工地舞台（天空 + 工程车 + 土堆），底部黄黑警示条上放大按钮；翻卡、卡册、选车都是全屏层 */
:root{
  --bg:#BDE9FF; --sky1:#6CCBFF; --sky2:#DDF5FF; --hill:#8ED07E; --hill2:#6DBE63;
  --g1:#C98A4B; --g2:#A96C34; --far:rgba(30,60,110,.16); --sun:#FFD54A; --cloud:#FFFFFF; --starop:0;
  --ink:#1B2246; --muted:#55608C; --title:#D61F2A; --title-edge:#FFFFFF;
  --panel:rgba(255,255,255,.92); --panel-ink:#1B2246; --ring:#FFFFFF;
  --timer-off:#C9D3E6; --album-bg:#EAF7FF; --lock:#D7E4F2; --lock-edge:#A9BAD0;
  --display:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --latin:"Lilita One","ZCOOL KuaiLe","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1338; --sky1:#0A1033; --sky2:#2A3C80; --hill:#2C5A49; --hill2:#22493B;
    --g1:#7E5631; --g2:#5E3E20; --far:rgba(200,215,255,.13); --sun:#F3EFD2; --cloud:rgba(255,255,255,.22); --starop:1;
    --ink:#F1F3FF; --muted:#AEB7DE; --title:#FFD54A; --title-edge:#1B2246;
    --panel:rgba(24,32,78,.92); --panel-ink:#F1F3FF; --ring:#8D9AC8;
    --timer-off:#34416E; --album-bg:#101945; --lock:#1D2858; --lock-edge:#3D4A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1338; --sky1:#0A1033; --sky2:#2A3C80; --hill:#2C5A49; --hill2:#22493B;
  --g1:#7E5631; --g2:#5E3E20; --far:rgba(200,215,255,.13); --sun:#F3EFD2; --cloud:rgba(255,255,255,.22); --starop:1;
  --ink:#F1F3FF; --muted:#AEB7DE; --title:#FFD54A; --title-edge:#1B2246;
  --panel:rgba(24,32,78,.92); --panel-ink:#F1F3FF; --ring:#8D9AC8;
  --timer-off:#34416E; --album-bg:#101945; --lock:#1D2858; --lock-edge:#3D4A80;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:linear-gradient(var(--sky1) 0 50%, var(--g1) 50% 100%)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid #2EC5FF;outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column;background:linear-gradient(var(--sky1),var(--sky2) 75%)}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px 4px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.brand{font-family:var(--display);font-size:clamp(20px,5.6vw,36px);line-height:1.1;color:var(--title);
  text-shadow:2px 2px 0 var(--title-edge),-2px 2px 0 var(--title-edge),2px -2px 0 var(--title-edge),-2px -2px 0 var(--title-edge),0 5px 0 rgba(0,0,0,.12);
  min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-short{display:none}
@media (max-width:440px){.b-long{display:none}.b-short{display:inline}}
.top-actions{display:flex;gap:8px;flex-shrink:0}
.chip{height:52px;min-width:52px;border-radius:26px;border:3px solid var(--ink);background:var(--panel);color:var(--panel-ink);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 11px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.chip svg{width:28px;height:28px;flex-shrink:0}
.chip .count{font-family:var(--latin);font-size:22px;font-variant-numeric:tabular-nums}
#albumBtn.bump{animation:bump .5s}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.25)}70%{transform:scale(.95)}100%{transform:scale(1)}}

.stage{flex:1;min-height:0;position:relative;cursor:pointer;touch-action:none}
#scene{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
.c-hill{fill:var(--hill)} .c-hill2{fill:var(--hill2)} .c-g1{fill:var(--g1)} .c-g2{fill:var(--g2)}
.c-far{fill:var(--far)} .c-farS{stroke:var(--far)} .c-sun{fill:var(--sun)} .c-cloud{fill:var(--cloud)}
.stars{opacity:var(--starop)}
.machine{display:none} .machine.on{display:inline}
#arm{transform-box:view-box;transform-origin:160px 170px;transition:transform .26s cubic-bezier(.4,1.6,.6,1)}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-2px,0)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
#dozerMove{transition:transform .12s linear}
#mound{transform-box:view-box;transform-origin:322px 230px;transition:transform .35s cubic-bezier(.4,1.6,.6,1)}
#moundGlow{transition:opacity .4s}
.popper{transform-box:view-box;transform-origin:322px 150px;opacity:0;transform:translateY(70px) scale(.4);transition:transform .6s cubic-bezier(.3,1.6,.5,1),opacity .3s;pointer-events:none}
.popper.up{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
#orb.up .orb-body{animation:bob 1.6s ease-in-out infinite}
.orb-body{transform-box:view-box;transform-origin:322px 150px}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.06)}}
#orbRing{transform-box:view-box;transform-origin:322px 150px;animation:spin 3s linear infinite;opacity:0}
#orb.super #orbRing{opacity:1}
#pointer{opacity:0;transition:opacity .3s}
#orb.up ~ #pointer{opacity:1}
#pointer path{animation:point .8s ease-in-out infinite}
@keyframes point{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
#pour{opacity:0;transition:opacity .3s}
#pour.on{opacity:1}
#drumStripes{transition:transform .5s cubic-bezier(.3,.8,.4,1)}

.controls{position:relative;background:var(--g1);display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,28px);
  padding-block:22px 16px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.controls::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:repeating-linear-gradient(-45deg,#FFC21A 0 14px,#1B2246 14px 28px)}
.meter{display:flex;gap:7px;flex-wrap:wrap;max-width:52vw;justify-content:center}
.light{width:clamp(22px,6.2vw,40px);aspect-ratio:1;border-radius:50%;background:var(--timer-off);border:4px solid var(--ring);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.15);transition:background .2s,box-shadow .2s,transform .2s}
.light.on{background:radial-gradient(circle at 38% 32%,#E8FDFF,#5EDCFF 45%,#1592D8);box-shadow:0 0 14px 4px rgba(46,197,255,.75);transform:scale(1.12)}
.holdbar{width:clamp(90px,30vw,180px);height:26px;border-radius:13px;border:4px solid var(--ring);background:var(--timer-off);overflow:hidden}
.holdbar i{display:block;height:100%;width:0;background:radial-gradient(circle at 50% 30%,#E8FDFF,#5EDCFF 45%,#1592D8);box-shadow:0 0 12px rgba(46,197,255,.8)}
#actBtn{--btn:#FFC21A;--btn-dk:#C98200;height:clamp(76px,13vh,96px);min-width:clamp(160px,44vw,260px);border-radius:999px;border:5px solid #1B2246;
  background:var(--btn);color:#1B2246;font-family:var(--latin);font-size:clamp(32px,9vw,48px);letter-spacing:.03em;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 24px;box-shadow:0 9px 0 var(--btn-dk),0 12px 18px rgba(0,0,0,.25);touch-action:none}
#actBtn svg{width:clamp(44px,11vw,58px);height:auto}
#actBtn:active,#actBtn.held{transform:translateY(7px);box-shadow:0 2px 0 var(--btn-dk)}
#actBtn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.06}}
#actBtn.open{--btn:#7FDBFF;--btn-dk:#1F8FCC}
#actBtn.open.r2{--btn:#CDA8FF;--btn-dk:#7C45E6}
#actBtn.open.r3{--btn:#FFE066;--btn-dk:#D99A00}
#actBtn[disabled]{opacity:.6;animation:none}

/* 卡片：参考集换式卡牌的金属边框 + 全幅大图 + 稀有度角标 + 战力 */
.card{container-type:inline-size;aspect-ratio:5/7;width:100%;max-width:100%;position:relative;perspective:1200px}
.card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.35,.5,1)}
.card-inner.facedown{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6.5cqw;padding:3cqw;background:var(--frameG);box-shadow:0 1.6cqw 0 rgba(0,0,0,.3),inset 0 0 0 .6cqw rgba(255,255,255,.55)}
.back{transform:rotateY(180deg);--frameG:linear-gradient(135deg,#F2F4F8,#9AA3B5 45%,#FFFFFF 55%,#7A8396)}
.face>.in{position:relative;width:100%;height:100%;border-radius:4.4cqw;overflow:hidden;box-shadow:inset 0 0 0 .5cqw rgba(0,0,0,.45)}
.back svg{width:100%;height:100%;display:block}
.r1{--frameG:linear-gradient(135deg,#EAF4FF,#6E9BD6 38%,#F7FBFF 52%,#4C73AE 78%,#BFD6F5);--bgA:#4C7CFF;--bgB:#0E1A5C;--ray:rgba(150,200,255,.35)}
.r2{--frameG:linear-gradient(135deg,#F7EEFF,#8B55E0 38%,#FFFFFF 52%,#5A28B0 78%,#E3CCFF);--bgA:#B47CFF;--bgB:#250C5E;--ray:rgba(220,180,255,.38)}
.r3{--frameG:linear-gradient(135deg,#FFF9CF,#E8A80C 36%,#FFFDE8 50%,#B8730A 74%,#FFE47A);--bgA:#FFE27A;--bgB:#9C3E04;--ray:rgba(255,240,170,.5)}
.front .in{background:radial-gradient(circle at 50% 40%,var(--bgA),var(--bgB) 72%)}
.k-hero .front .in::before{content:"";position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg at 50% 45%,var(--ray) 0deg 7deg,transparent 7deg 16deg)}
.k-hero .front .in::after{content:"";position:absolute;left:0;right:0;bottom:12%;height:22%;pointer-events:none;
  background:linear-gradient(transparent,rgba(5,8,30,.55)),repeating-linear-gradient(90deg,rgba(10,16,50,.85) 0 7%,transparent 7% 9%,rgba(10,16,50,.85) 9% 13%,transparent 13% 17%);-webkit-mask:linear-gradient(transparent 0 30%,#000 30%);mask:linear-gradient(transparent 0 30%,#000 30%)}
.art{position:absolute;left:0;right:0;top:4%;bottom:14%;z-index:1}
.k-hero .art{top:3%;bottom:15%}
.art svg{width:100%;height:100%;display:block}
.k-car .art,.k-air .art,.k-army .art{top:0;bottom:0}
.rk{position:absolute;left:3cqw;top:2.6cqw;z-index:3;font-family:var(--latin);font-size:11cqw;line-height:1;letter-spacing:.02em;color:#FFFFFF;
  -webkit-text-stroke:.9cqw #1B2246;paint-order:stroke fill;text-shadow:0 .8cqw 0 rgba(0,0,0,.35)}
.r2 .rk{color:#E8D2FF} .r3 .rk{color:#FFE066}
.pw{position:absolute;right:3cqw;top:3cqw;z-index:3;display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.pw b{font-family:var(--latin);font-weight:400;font-size:9cqw;color:#FFFFFF;-webkit-text-stroke:.8cqw #1B2246;paint-order:stroke fill}
.pw small{font-family:var(--display);font-size:4.6cqw;color:#1B2246;background:#FFD447;border-radius:2cqw;padding:.4cqw 1.6cqw;margin-bottom:.6cqw}
.plate{position:absolute;left:-1cqw;right:-1cqw;bottom:0;height:17%;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4cqw;
  background:linear-gradient(180deg,#26338A,#0F1648);border-top:1.4cqw solid #FFD447;box-shadow:0 -1cqw 2cqw rgba(0,0,0,.35)}
.r1 .plate{border-top-color:#8FC0FF} .r2 .plate{border-top-color:#C9A2FF}
.plate .st{color:#FFD447;font-size:5.6cqw;line-height:1;letter-spacing:.15em}
.plate .nm{font-family:var(--display);color:#FFFFFF;font-size:10cqw;line-height:1.05;white-space:nowrap;text-shadow:0 .6cqw 0 rgba(0,0,0,.5)}
.plate .nm.long{font-size:8.4cqw}
.holo{position:absolute;inset:0;z-index:5;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.7) 42%,rgba(160,230,255,.45) 47%,rgba(255,170,240,.4) 52%,transparent 64%);background-size:260% 100%;animation:shine 2.6s linear infinite}
.r2 .holo{opacity:.6}
@keyframes shine{from{background-position:130% 0}to{background-position:-130% 0}}

.layer{position:fixed;inset:0;z-index:30;padding-top:max(14px, env(safe-area-inset-top, 0px));padding-bottom:max(14px, env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#reveal{background:rgba(8,12,38,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.8vh,16px);overflow:hidden}
#reveal .rays{position:absolute;left:50%;top:34%;width:190vmax;height:190vmax;translate:-50% -50%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,var(--ray,#5EDCFF) 0deg 9deg,transparent 9deg 18deg);opacity:.28;
  -webkit-mask:radial-gradient(circle,#000 8%,transparent 45%);mask:radial-gradient(circle,#000 8%,transparent 45%);animation:spin 22s linear infinite}
#revealCard{position:relative;width:min(58vw,36vh,290px);cursor:pointer;transition:transform .55s cubic-bezier(.5,-.3,.7,1),opacity .55s;flex-shrink:0}
#revealCard.pop{animation:popIn .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes popIn{from{transform:scale(.2) rotate(-12deg);opacity:0}to{transform:scale(1);opacity:1}}
.rinfo{position:relative;text-align:center;color:#FFFFFF;display:flex;flex-direction:column;align-items:center;gap:6px;transition:opacity .3s;max-width:34em;min-height:0}
.rinfo.hide{opacity:0}
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.rname{font-family:var(--display);font-size:clamp(28px,7.5vw,46px);line-height:1.1;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.rtag{font-size:clamp(14px,3.8vw,18px);color:#FFE27A;font-weight:600}
.rintro{font-size:clamp(15px,4vw,18px);line-height:1.6;color:#E6EBFF;text-align:left;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 14px;max-height:22vh;overflow-y:auto;text-wrap:pretty}
.rbadge{font-family:var(--display);font-size:clamp(16px,4.2vw,22px);padding:2px 14px;border-radius:999px;background:#E3262E;color:#FFFFFF;transform:rotate(-4deg);border:3px solid #FFFFFF;white-space:nowrap}
.rbadge.dup{background:#2E8BFF}
.rbtns{position:relative;display:flex;gap:14px;align-items:center;transition:opacity .3s;flex-shrink:0}
.rbtns.hide{opacity:0;pointer-events:none}
.bigbtn{height:68px;padding:0 30px;border-radius:999px;border:5px solid #1B2246;background:#FFC21A;color:#1B2246;font-family:var(--latin);font-size:clamp(26px,7vw,34px);letter-spacing:.03em;box-shadow:0 7px 0 #C98200}
.bigbtn:active{transform:translateY(5px);box-shadow:0 2px 0 #C98200}
.roundbtn{width:68px;height:68px;border-radius:50%;border:5px solid #1B2246;background:#FFFFFF;color:#1B2246;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 7px 0 #A9B1C2;flex-shrink:0}
.roundbtn:active{transform:translateY(5px);box-shadow:0 2px 0 #A9B1C2}
.roundbtn svg{width:34px;height:34px}

#flash{position:fixed;inset:0;z-index:40;background:#FFFFFF;opacity:0;pointer-events:none}
#flash.go{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
#fx{position:fixed;inset:0;z-index:45;pointer-events:none;width:100%;height:100%}

#album{z-index:25;background:var(--album-bg);display:flex;flex-direction:column;padding-bottom:0}
.al-head{display:flex;align-items:center;gap:12px;padding-block:4px 10px}
.al-title{font-family:var(--display);font-size:clamp(26px,6.5vw,38px);color:var(--title);flex:1;min-width:0;
  text-shadow:2px 2px 0 var(--title-edge),-2px 2px 0 var(--title-edge),2px -2px 0 var(--title-edge),-2px -2px 0 var(--title-edge)}
.al-prog{display:flex;align-items:center;gap:10px;padding-bottom:12px}
.bar{flex:1;height:22px;border-radius:11px;background:var(--lock);border:3px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,#FFC21A 0 12px,#FFB000 12px 24px);transition:width .6s}
.al-num{font-family:var(--latin);font-size:24px;font-variant-numeric:tabular-nums;color:var(--ink)}
.al-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:max(24px, env(safe-area-inset-bottom, 0px))}
.al-sec{font-family:var(--display);font-size:24px;color:var(--ink);margin:6px 0 10px;display:flex;align-items:center;gap:8px}
.al-sec small{font-family:var(--latin);font-size:16px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(104px,27vw),1fr));gap:14px;margin-bottom:22px;padding-top:8px}
.slot{position:relative;border:0;background:none;padding:0;display:block;width:100%}
.slot:active{transform:scale(.96)}
.lock{aspect-ratio:5/7;border-radius:12px;background:var(--lock);border:3px dashed var(--lock-edge);display:flex;align-items:center;justify-content:center;
  font-family:var(--latin);font-size:44px;color:var(--lock-edge)}
.cnt{position:absolute;top:-8px;right:-6px;z-index:2;min-width:34px;height:30px;border-radius:15px;background:#E3262E;color:#FFFFFF;border:3px solid #FFFFFF;
  font-family:var(--latin);font-size:16px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.al-foot{display:flex;justify-content:center;padding-block:4px 8px}
#resetBtn{border:0;background:none;color:var(--muted);font-size:15px;text-decoration:underline;padding:10px}
#resetBtn.warn{color:#E3262E;font-weight:700}

#chooser{z-index:32;background:rgba(8,12,38,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#FFFFFF;text-align:center}
.ch-title{font-family:var(--display);font-size:clamp(28px,7.5vw,44px);text-shadow:0 4px 0 rgba(0,0,0,.35)}
.ch-sub{font-size:clamp(15px,4vw,19px);color:#FFE27A;font-weight:600}
.ch-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:min(100%,560px)}
.ch-item{border:5px solid #1B2246;border-radius:22px;background:#FFF4D2;color:#1B2246;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 7px 0 #C98200}
.ch-item.cur{background:#FFE066;outline:5px solid #5EDCFF;outline-offset:3px}
.ch-item:active{transform:translateY(5px);box-shadow:0 2px 0 #C98200}
.ch-item svg{width:100%;max-width:170px;height:auto}
.ch-name{font-family:var(--display);font-size:clamp(20px,5vw,26px)}
.ch-verb{font-family:var(--latin);font-size:clamp(18px,4.6vw,24px);color:#D61F2A}

#start{z-index:35;background:linear-gradient(var(--sky1),var(--sky2) 70%,var(--g1) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,3vh,26px);text-align:center}
.st-title{font-family:var(--display);font-size:clamp(40px,11vw,72px);line-height:1.05;color:var(--title);text-wrap:balance;
  text-shadow:3px 3px 0 var(--title-edge),-3px 3px 0 var(--title-edge),3px -3px 0 var(--title-edge),-3px -3px 0 var(--title-edge),0 8px 0 rgba(0,0,0,.15)}
.st-sub{font-size:clamp(17px,4.4vw,22px);color:var(--ink);font-weight:600}
.st-art{display:flex;align-items:flex-end;justify-content:center;width:min(92vw,520px);height:min(38vh,300px)}

const TEXT={"hello": "小队员你好！我们开着工程车，去挖奥特曼卡片吧！点黄色的大按钮开始！", "welcome": "欢迎回来，小队员！继续挖宝吧！", "c1": "一！", "c2": "二！", "c3": "三！", "c4": "四！", "c5": "五！", "orb": "挖到光球啦！快点一点！", "orbGold": "哇！是金色的光球！快点一点！", "empty1": "哎呀，什么都没挖到！没关系，再来一次！", "empty2": "咦？只挖到一块小石头。别灰心，再试一次！", "new": "新卡片！", "super": "超级稀有！", "again": "又见面啦！", "album": "这是你的卡册！点一点卡片，听听它的故事。", "locked": "这张还没挖到，快去挖吧！", "done": "太棒了！所有卡片都集齐啦！你是奥特曼防卫队的大队长！", "soundon": "声音打开啦！", "choose": "你已经挖了十次啦！选一台工程车，换个玩法吧！", "m_digger": "挖掘机！点三下，挖挖挖！", "m_dozer": "推土机！按住按钮不放，推推推！", "m_crane": "大吊车！看准了再按，抓光球！", "m_mixer": "搅拌车！点五下，转转转！", "push": "推推推！", "miss": "差一点点！再试一次！", "grab": "抓到啦！", "n_orig": "初代奥特曼！", "i_orig": "初代奥特曼来自M78星云光之国，是第一位来到地球守护大家的奥特曼。他和科学特搜队一起打怪兽，招牌必杀技是双手交叉放出的斯派修姆光线！", "n_seven": "赛文奥特曼！", "i_seven": "赛文奥特曼也来自M78星云，是宇宙警备队的一员。他头上的头镖能飞出去切开敌人，额头的光束灯能放出艾梅利姆光线。他的儿子就是赛罗奥特曼！", "n_jack": "杰克奥特曼！", "i_jack": "杰克奥特曼又叫归来的奥特曼。他手腕上戴着赛文送的奥特手镯，可以变成飞镖、长枪和盾牌，本领特别多，必杀技是斯派修姆光线！", "n_ace": "艾斯奥特曼！", "i_ace": "艾斯奥特曼是奥特兄弟的第五位，会的光线技特别多。他最有名的必杀技是梅塔利姆光线，还能用光做成锋利的光轮把怪兽切开！", "n_taro": "泰罗奥特曼！", "i_taro": "泰罗奥特曼是奥特之父和奥特之母的儿子，头上有一对威风的奥特之角。他力气超大，必杀技是斯特利姆光线。后来他的儿子泰迦也成了奥特曼！", "n_leo": "雷欧奥特曼！", "i_leo": "雷欧奥特曼来自狮子座L77星，故乡被毁后留在地球。他是功夫高手，最擅长雷欧飞踢。在赛文的严格训练下，他变得越来越强！", "n_astra": "阿斯特拉！", "i_astra": "阿斯特拉是雷欧奥特曼的弟弟，也来自L77星。兄弟俩长得很像，常常一起并肩作战，配合得特别默契！", "n_zoffy": "佐菲奥特曼！", "i_zoffy": "佐菲奥特曼是奥特兄弟中的大哥，也是宇宙警备队的队长。他胸前和肩上有一颗颗星星勋章，代表他立过的许多功劳，必杀技是M87光线！", "n_father": "奥特之父！", "i_father": "奥特之父是宇宙警备队的大队长，头上有一对又长又弯的奥特之角。他是泰罗的爸爸，守护光之国很多很多年，是大家最敬佩的长辈！", "n_mother": "奥特之母！", "i_mother": "奥特之母是光之国银十字军的队长，专门给受伤的奥特曼治疗。她温柔又强大，能用治愈的光让大家重新恢复力气。她是泰罗的妈妈！", "n_king": "奥特之王！", "i_king": "奥特之王是光之国最古老、最厉害的奥特曼，住在王者之星。他留着白胡子，披着红斗篷，什么危机都能化解。雷欧遇到大麻烦时，就是他来帮忙！", "n_joneus": "乔尼亚斯！", "i_joneus": "乔尼亚斯出自动画片《宇宙英雄奥特曼》，来自U40星。他和科学警备队一起保护地球，必杀技是普拉尼乌姆光线！", "n_eighty": "爱迪奥特曼！", "i_eighty": "爱迪奥特曼也叫奥特曼80，变身前是一位中学老师。他一边教学生，一边保护地球，必杀技是双手摆成L字放出的光线！", "n_yullian": "尤莉安！", "i_yullian": "尤莉安是光之国的公主，也是一位女奥特曼。她来到地球帮助爱迪奥特曼，两个人一起战斗，是一对好搭档！", "n_great": "葛雷奥特曼！", "i_great": "葛雷奥特曼是在澳大利亚拍摄的奥特曼，红银相间的身体很结实。他和地球上的伙伴一起保护大自然，必杀技是威力很大的光线！", "n_powered": "帕瓦特奥特曼！", "i_powered": "帕瓦特奥特曼是在美国拍摄的奥特曼，身材高大，造型简洁有力。他和防卫队W.I.N.R.一起保护地球，必杀技是威力加强的斯派修姆光线！", "n_tiga": "迪迦奥特曼！", "i_tiga": "迪迦奥特曼是三千万年前的光之巨人，在现代被大古唤醒。他能在复合型、强力型和空中型之间变换颜色，必杀技是哉佩利敖光线！", "n_dyna": "戴拿奥特曼！", "i_dyna": "戴拿奥特曼守护着人类飞向宇宙的新时代。他能变成力气大的强壮型和本领多的奇迹型，必杀技是索尔吉恩特光线！", "n_gaia": "盖亚奥特曼！", "i_gaia": "盖亚奥特曼是地球自己产生的光之巨人，代表大地的力量。他又聪明又有力气，最有名的必杀技是用头上的冠饰放出的光子边缘！", "n_agul": "阿古茹奥特曼！", "i_agul": "阿古茹奥特曼是代表大海的光之巨人，身体是蓝色的。他一开始和盖亚意见不合，后来两人成为并肩作战的好伙伴！", "n_neos": "奈欧斯奥特曼！", "i_neos": "奈欧斯奥特曼是新世纪的奥特曼，红色和银色的身体非常帅气。他和蓝色的战友赛文21一起，保护地球不受怪兽和宇宙人的伤害。", "n_seven21": "赛文21！", "i_seven21": "赛文21是一位蓝红相间的奥特战士，头上也有一把头镖。他和奈欧斯奥特曼是好战友，一起守护地球。", "n_cosmos": "高斯奥特曼！", "i_cosmos": "高斯奥特曼是一位非常温柔的奥特曼，不喜欢伤害怪兽。他常用蓝色月神型的光安抚怪兽，让它们回到大自然；需要战斗时会变成红色的日冕型！", "n_nexus": "奈克瑟斯奥特曼！", "i_nexus": "奈克瑟斯奥特曼是神秘的银色巨人，胸口有Y字形的能量核心。他的光会从一个勇敢的人传给下一个勇敢的人，大家一起把光传下去！", "n_noa": "诺亚奥特曼！", "i_noa": "诺亚奥特曼是传说中的银色巨人，奈克瑟斯就是他力量的一部分。他背后有一对像翅膀一样的诺亚之翼，非常非常强大！", "n_max": "麦克斯奥特曼！", "i_max": "麦克斯奥特曼号称最快最强，来自M78星云。他头上的冠饰可以取下来，像飞刀一样飞出去攻击，必杀技是麦克西姆加农！", "n_xenon": "杰诺奥特曼！", "i_xenon": "杰诺奥特曼是麦克斯奥特曼的前辈和战友，常在宇宙里巡逻。关键时刻他会赶来帮忙，和麦克斯一起打败强敌！", "n_mebius": "梦比优斯奥特曼！", "i_mebius": "梦比优斯奥特曼是宇宙警备队最年轻的新人，变身前叫未来。他和CREW GUYS的伙伴们一起成长，必杀技是双手交叉成十字放出的光线！", "n_hikari": "希卡利奥特曼！", "i_hikari": "希卡利是光之国的科学家，有着蓝色的身体。他手上的骑士臂环能变出光剑，后来成为梦比优斯的好伙伴，一起战斗。", "n_sevenx": "赛文X！", "i_sevenx": "赛文X是一位神秘的奥特战士，和赛文奥特曼长得有点像，头上也有一把头镖，可以飞出去攻击敌人。", "n_zero": "赛罗奥特曼！", "i_zero": "赛罗奥特曼是赛文奥特曼的儿子，雷欧是他的师父。他头上有两把头镖，还会变成很多形态。他最爱说：你还早两万年呢！", "n_ginga": "银河奥特曼！", "i_ginga": "银河奥特曼来自未来，身上有很多亮晶晶的水晶。水晶变成不同颜色，就能放出不同的必杀技，比如银河十字射击！", "n_victory": "维克特利奥特曼！", "i_victory": "维克特利奥特曼来自地底世界，守护着地下的人们。他的右手能变成怪兽的武器，和银河奥特曼是一对好搭档！", "n_x": "艾克斯奥特曼！", "i_x": "艾克斯奥特曼和地球青年大地合体战斗，胸前有X字形的计时器。他能穿上用怪兽卡片变出的铠甲，必杀技是扎纳迪姆光线！", "n_orb": "欧布奥特曼！", "i_orb": "欧布奥特曼是一位流浪的战士，能借用两位前辈奥特曼的力量合成新形态，比如重光形态。必杀技是双手交叉放出的光线！", "n_geed": "捷德奥特曼！", "i_geed": "捷德奥特曼是贝利亚的儿子，眼睛看起来有点凶，但心地非常善良。他用奥特胶囊组合前辈的力量变身，一心想成为大家的英雄！", "n_rosso": "罗索奥特曼！", "i_rosso": "罗索奥特曼是兄弟奥特曼里的哥哥，红色代表火焰。他和弟弟布鲁一起变身，兄弟合体还能变成更强的露布奥特曼！", "n_blu": "布鲁奥特曼！", "i_blu": "布鲁奥特曼是兄弟奥特曼里的弟弟，蓝色代表水。他和哥哥罗索默契十足，换上不同的水晶还能用风、土等不同的力量！", "n_grigio": "格丽乔！", "i_grigio": "格丽乔是罗索和布鲁的妹妹变成的女奥特曼。她能用治愈的光帮助哥哥们，也会勇敢地保护大家。", "n_taiga": "泰迦奥特曼！", "i_taiga": "泰迦奥特曼是泰罗奥特曼的儿子，头上有一对小小的奥特之角。他和泰塔斯、风马组成三人小队，必杀技是从手臂放出的强力光线！", "n_titas": "泰塔斯！", "i_titas": "泰塔斯来自U40星，是三人小队里的大力士，肌肉超级发达。他最喜欢锻炼身体，一拳就能把怪兽打飞！", "n_fuma": "风马！", "i_fuma": "风马来自O-50星，是像忍者一样的奥特战士，速度快得像风。他会扔出光之手里剑，是三人小队里跑得最快的！", "n_zeta": "泽塔奥特曼！", "i_zeta": "泽塔奥特曼是赛罗的徒弟，说话很有趣，总爱在句子前面加上Ultra。他能用前辈们的奖牌变成不同形态，必杀技是泽斯蒂姆光线！", "n_trigger": "特利迦奥特曼！", "i_trigger": "特利迦奥特曼是新时代的光之巨人，能在复合型、强力型和空中型之间变换。他的武器是圆环光刃，必杀技是哉佩利敖光线！", "n_decker": "德凯奥特曼！", "i_decker": "德凯奥特曼用奥特卡片变身，能变成闪亮型、强壮型和奇迹型。他和防卫队GUTS-SELECT的伙伴一起保护地球！", "n_blazar": "布莱泽奥特曼！", "i_blazar": "布莱泽奥特曼很有野性，喜欢用大声的呐喊表达心情。他变身前是特殊怪兽应对小队SKaRD的队长，是一位勇敢可靠的爸爸！", "n_arc": "阿克奥特曼！", "i_arc": "阿克奥特曼的力量来自想象力。变身前的青年在怪兽调查机构工作，最爱动脑筋想办法。他相信只要敢想，就能战胜任何怪兽！", "n_omega": "欧米伽奥特曼！", "i_omega": "欧米伽奥特曼失去了记忆，从天上掉到了地球，和一位地球青年成为好朋友。他的武器是红色的欧米伽头镖，必杀技是双手交叉放出的光线！", "n_teo": "提欧奥特曼！", "i_teo": "提欧奥特曼是来自H12星的蓝色巨人，故乡被宇宙怪兽毁掉后来到地球，平时化身成学兽医的大学生。他在山里遇到了小怪兽普奇！", "n_digger": "挖掘机！", "i_digger": "挖挖挖，力气大！大铲斗一下就能挖起好多土！", "n_dozer": "推土机！", "i_dozer": "推推推，大铲刀把路推得平平的！", "n_mixer": "水泥搅拌车！", "i_mixer": "大肚子转呀转，把水泥送到工地！", "n_dump": "自卸卡车！", "i_dump": "车斗一抬，哗啦啦，沙土全倒出来！", "n_roller": "压路机！", "i_roller": "大滚轮压一压，路面平平又光光！", "n_crane": "大吊车！", "i_crane": "长长的吊臂，能把很重的东西吊上高楼！", "n_gold": "金色挖掘机！", "i_gold": "金色挖掘机！闪闪发光，超级厉害！", "n_airliner": "大客机！", "i_airliner": "大客机能坐好几百人，带大家飞到很远的地方！", "n_heli": "直升机！", "i_heli": "螺旋桨转呀转，直升机能直直地飞上天，还能停在空中！", "n_transport": "大运输机！", "i_transport": "大运输机的肚子特别大，坦克和卡车都能装进去！", "n_fighter": "战斗机！", "i_fighter": "战斗机飞得比声音还快，守护祖国的天空！", "n_stealth": "隐身战斗机！", "i_stealth": "隐身战斗机，雷达都很难发现它，超级厉害！", "n_aew": "预警机！", "i_aew": "预警机背上的大圆盘是雷达，能看到很远很远的地方！", "n_tank": "坦克！", "i_tank": "履带轰隆隆，坦克穿着厚厚的盔甲，真威风！", "n_apc": "装甲车！", "i_apc": "装甲车有八个大轮子，跑得又快又稳！", "n_rocket": "火箭炮车！", "i_rocket": "火箭炮车背着一排排火箭，整整齐齐！", "n_carrier": "航空母舰！", "i_carrier": "航空母舰是海上的大机场，战斗机能在上面起飞和降落！"};

/* ---------- 声音：音效 + 旁白 ---------- */
let muted=false, ac=null;
function audio(){ try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){ ac=null; } return ac; }
function tone(f,t0,dur,type,vol,slide){
  const a=audio(); if(!a||muted) return;
  try{ const t=a.currentTime+t0, o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.2,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05); }catch(e){}
}
function noise(t0,dur,vol,freq){
  const a=audio(); if(!a||muted) return;
  try{ const len=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=a.createBufferSource(), fl=a.createBiquadFilter(), g=a.createGain(), t=a.currentTime+t0;
    src.buffer=buf; fl.type='lowpass'; fl.frequency.value=freq||800; g.gain.value=vol||.3; src.connect(fl).connect(g).connect(a.destination); src.start(t); }catch(e){}
}
const sfx={
  tap(){ tone(760,0,.08,'triangle',.12); },
  dig(){ tone(170,0,.28,'sine',.55,48); noise(0,.3,.4,700); },
  engine(){ tone(90,0,.18,'sawtooth',.08,120); },
  orb(){ tone(380,0,.5,'triangle',.22,1300); tone(1300,.35,.25,'sine',.12,1700); },
  boing(){ tone(300,0,.25,'sine',.25,120); tone(200,.12,.3,'triangle',.15,90); },
  open(r){ const n=r===3?[523,659,784,1047,1319,1568,2093]:r===2?[523,659,784,1047,1319]:[523,659,784,1047];
    n.forEach((f,i)=>{ tone(f,i*.11,.32,'triangle',.2); tone(f*2,i*.11,.18,'sine',.05); }); noise(0,.5,.12,4000); },
  whoosh(){ tone(900,0,.4,'sine',.12,200); },
};
let zhVoice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices();
  zhVoice=vs.find(v=>/zh[-_]CN/i.test(v.lang)&&/Yunjian|Yunyang|Male|男/i.test(v.name))||vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null; }catch(e){} }
if('speechSynthesis' in window){ pickVoice(); try{ speechSynthesis.addEventListener('voiceschanged',pickVoice); }catch(e){} }
const player=new Audio(); player.preload='auto';
let queue=[], qToken=0;
function stopVoice(){ qToken++; queue=[]; try{ player.pause(); }catch(e){} try{ speechSynthesis.cancel(); }catch(e){} }
function say(keys){ stopVoice(); if(muted) return; queue=keys.filter(k=>TEXT[k]); next(qToken); }
const HAS_AUDIO=Object.keys(AUDIO).length>0;
// 只用一种声音：有录好的旁白就只放旁白，失败重试一次，再失败就跳过这一句；完全没有旁白时才用系统语音
function next(tok){
  if(tok!==qToken) return;
  const k=queue.shift(); if(!k) return;
  const done=()=>{ if(tok===qToken) next(tok); };
  const url=AUDIO[k];
  if(!url){ if(HAS_AUDIO) done(); else speak(k,done); return; }
  let attempt=0;
  const go=src=>{
    if(tok!==qToken) return;
    const my=++attempt; let failed=false;
    const fail=()=>{ if(failed||my!==attempt||tok!==qToken) return; failed=true; if(my===1&&src!==url) go(url); else done(); };
    player.onended=()=>{ if(my===attempt&&tok===qToken) done(); };
    player.onerror=fail;
    try{ player.src=src; const p=player.play(); if(p&&p.catch) p.catch(e=>{ if(e&&e.name==='AbortError') return; fail(); }); }catch(e){ fail(); }
  };
  const c=CLIP[k];
  if(c&&c.url) go(c.url); else fetchClip(k).then(u=>go(u||url));
}
function speak(k,cb){
  if(!('speechSynthesis' in window)){ cb(); return; }
  try{ const u=new SpeechSynthesisUtterance(TEXT[k]); u.lang='zh-CN'; if(zhVoice) u.voice=zhVoice; u.rate=.95; u.pitch=.9; u.onend=cb; u.onerror=cb; speechSynthesis.speak(u); }catch(e){ cb(); }
}
const CLIP={};
function fetchClip(k){
  const url=AUDIO[k]; if(!url) return Promise.resolve(null);
  if(!CLIP[k]){ CLIP[k]={p:fetch(url).then(r=>r.ok&&/audio|mpeg|octet/i.test(r.headers.get('content-type')||'')?r.blob():null).then(b=>{ const u=b?URL.createObjectURL(b):url; CLIP[k].url=u; return u; }).catch(()=>{ CLIP[k].url=url; return url; })}; }
  return CLIP[k].p;
}
function warm(keys){ keys.forEach(k=>fetchClip(k)); }
const FIXED=['c1','c2','c3','c4','c5','orb','orbGold','new','super','again','empty1','empty2','push','miss','grab','album','locked','choose','m_digger','m_dozer','m_crane','m_mixer','soundon','welcome','hello','done'];

const fx=$('#fx'), ctx=fx.getContext('2d'); let parts=[], running=false;
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function sizeFx(){ const d=Math.min(window.devicePixelRatio||1,2); fx.width=innerWidth*d; fx.height=innerHeight*d; ctx.setTransform(d,0,0,d,0,0); }
sizeFx(); addEventListener('resize',sizeFx);
function burst(x,y,o){
  const n=Math.round((o.n||30)*(reduce?.3:1));
  for(let i=0;i<n;i++){ const a=(o.angle!=null?o.angle:-Math.PI/2)+(Math.random()-.5)*(o.spread||Math.PI*2), sp=(o.speed||7)*(.4+Math.random()*.8);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:o.gravity==null?.25:o.gravity,life:0,max:(o.life||70)*(.7+Math.random()*.5),
      c:o.colors[i%o.colors.length],r:(o.size||7)*(.5+Math.random()*.8),rot:Math.random()*6,vr:(Math.random()-.5)*.3,shape:o.shape||'star'}); }
  if(!running){ running=true; requestAnimationFrame(tick); }
}
function star(x,y,r,rot){ ctx.beginPath(); for(let i=0;i<10;i++){ const a=rot+i*Math.PI/5, rr=i%2?r*.45:r; ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);} ctx.closePath(); ctx.fill(); }
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight); parts=parts.filter(p=>p.life<p.max);
  for(const p of parts){ p.life++; p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=.985; p.rot+=p.vr;
    ctx.globalAlpha=Math.max(0,1-p.life/p.max); ctx.fillStyle=p.c;
    if(p.shape==='dot'){ ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); } else star(p.x,p.y,p.r,p.rot); }
  ctx.globalAlpha=1; if(parts.length) requestAnimationFrame(tick); else { running=false; ctx.clearRect(0,0,innerWidth,innerHeight); }
}
const scene=$('#scene');
function toScreen(x,y){ const m=scene.getScreenCTM(); return m?{x:m.a*x+m.c*y+m.e,y:m.b*x+m.d*y+m.f}:{x:innerWidth/2,y:innerHeight/2}; }
function centerOf(el){ const r=el.getBoundingClientRect(); return {x:r.left+r.width/2,y:r.top+r.height/2}; }

const rand=a=>a[Math.floor(Math.random()*a.length)];
function pick(){
  if(save.total===0) return rand(CARDS.filter(c=>c.kind==='hero'&&c.r===2));
  const roll=Math.random()*100; const r=save.sinceSuper>=7?3:roll<10?3:roll<40?2:1;
  let pool=CARDS.filter(c=>c.r===r); const fresh=pool.filter(c=>!save.counts[c.id]);
  if(fresh.length&&Math.random()<.75) pool=fresh;
  else if(!fresh.length&&Math.random()<.5){ const any=CARDS.filter(c=>!save.counts[c.id]); if(any.length) pool=any; }
  return rand(pool);
}

function buildMeter(){

function beginRound(){

function act(){

function digStep(){

}

}

});

/* ---------- 绑定 ---------- */
actBtn.addEventListener('pointerdown',e=>{ if(save.machine==='dozer'&&state==='idle'){ e.preventDefault(); try{actBtn.setPointerCapture(e.pointerId);}catch(_){} holdStart(); } });
['pointerup','pointercancel','pointerleave'].forEach(t=>actBtn.addEventListener(t,holdEnd));
actBtn.addEventListener('click',e=>{ e.stopPropagation(); if(save.machine==='dozer'&&state==='idle') return; act(); });
actBtn.addEventListener('keydown',e=>{ if(save.machine==='dozer'&&state==='idle'&&(e.key===' '||e.key==='Enter')){ e.preventDefault(); holdStart(); } });
actBtn.addEventListener('keyup',e=>{ if(e.key===' '||e.key==='Enter') holdEnd(); });
const stage=$('#stage');
stage.addEventListener('pointerdown',e=>{ if(save.machine==='dozer'&&state==='idle'){ holdStart(); } });
['pointerup','pointercancel','pointerleave'].forEach(t=>stage.addEventListener(t,holdEnd));
stage.addEventListener('click',()=>{ if(save.machine==='dozer'&&state==='idle') return; act(); });
orb.addEventListener('click',e=>{ e.stopPropagation(); openOrb(); });
$('#collectBtn').addEventListener('click',()=>{ sfx.tap(); collect(); });
$('#againBtn').addEventListener('click',()=>{ if(shown) say(seqFor(shown.c,{view:true})); });
$('#revealCard').addEventListener('click',()=>{ if(shown&&!$('#rinfo').classList.contains('hide')) say(['n_'+shown.c.id]); });
$('#soundBtn').addEventListener('click',()=>{
  muted=!muted; $('#waves').style.display=muted?'none':''; $('#mutex').style.display=muted?'':'none';
  if(muted) stopVoice(); else { sfx.tap(); say(['soundon']); }
});
// 画墙图：迪迦 + 挖掘机
$('#startArt').innerHTML=heroSVG('tiga').replace('<svg','<svg class="hero"')+vehicleSVG({v:'digger',c:'#FFC21A'},{bg:false});
// 吊车桁架
(function(){ let z='M122 186'; for(let i=1;i<=12;i++){ const t=i/12, sd=i%2; const x=sd?132+(322-132)*t:112+(312-112)*t, y=sd?194+(60-194)*t:184+(48-184)*t; z+=` L${f1(x)} ${f1(y)}`; } $('#craneLattice').setAttribute('d',z); })();
$('#startBtn').addEventListener('click',()=>{
  audio(); try{ const k0=owned()?'welcome':'hello'; if(AUDIO[k0]){ player.src=AUDIO[k0]; const pp=player.play(); if(pp&&pp.catch) pp.catch(()=>{}); } }catch(e){}
  sfx.open(2); $('#start').hidden=true; state='idle'; warm(FIXED);
  setMachine(MACHINES[save.machine]?save.machine:'digger');
  if(save.unlocked) $('#machineBtn').hidden=false;
  CLIP[owned()?'welcome':'hello']={url:AUDIO[owned()?'welcome':'hello'],p:Promise.resolve(AUDIO[owned()?'welcome':'hello'])};
  say([owned()?'welcome':'hello']);
});
document.querySelectorAll('.machine').forEach(g=>g.classList.toggle('on',g.id==='m-'+(MACHINES[save.machine]?save.machine:'digger')));
updateAlbumCount();
window.__game={heroSVG,CARDS,save};
})();
</script>
