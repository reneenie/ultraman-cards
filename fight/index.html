<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>奥特曼打怪兽</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
/* 布局：全屏特摄战场（远景城市→演员→特效→胶片颗粒/黑边），HUD 在上，三个大按钮在下；选人、选怪兽、图鉴是全屏层 */
:root{
  --night:#0A0E1F; --dusk:#2A2D5C; --ember:#FF8A3D; --steel:#C9D1E0; --ink:#F2F4FF; --muted:#AAB3D6;
  --timer:#5EDCFF; --danger:#FF3B30; --gold:#FFD447; --panel:rgba(10,14,36,.78);
  --display:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:#05070F}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--timer);outline-offset:3px}

#stage{position:fixed;inset:0;overflow:hidden;background:#05070F}
#world{position:absolute;inset:0;filter:contrast(1.08) saturate(1.12)}
#bg,#fx,#grain{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#grain{pointer-events:none;opacity:.09;mix-blend-mode:overlay;image-rendering:pixelated}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(0,0,0,.55) 100%)}
.bars::before,.bars::after{content:"";position:absolute;left:0;right:0;height:5vh;background:#000;z-index:6;pointer-events:none}
.bars::before{top:0} .bars::after{bottom:0}
@media (orientation:portrait){.bars::before,.bars::after{display:none}}

.actor{position:absolute;will-change:transform;transform-origin:50% 100%;z-index:3}
.actor svg{width:100%;height:100%;display:block;overflow:visible}
.photo{width:100%;height:100%;display:block;object-fit:contain;object-position:50% 100%;-webkit-user-drag:none;
  filter:brightness(.92) contrast(1.06) saturate(1.06) drop-shadow(-6px -4px 10px rgba(255,140,80,.28)) drop-shadow(0 0 14px rgba(120,140,255,.25))}
.photo.mir{transform:scaleX(-1)}
img.photo{transform-origin:50% 100%;transition:transform .14s cubic-bezier(.3,1.4,.5,1)}
/* 整张图的动作：先后仰蓄力，再前冲；身体始终是完整的一张图 */
#heroArt[data-pose=punch] img.photo,#heroArt[data-pose=thrown] img.photo{animation:pPunch .27s cubic-bezier(.2,.9,.3,1) both}
#heroArt[data-pose=kick] img.photo{animation:pKick .27s cubic-bezier(.2,.9,.3,1) both}
#heroArt[data-pose=guard] img.photo{transform:rotate(-6deg) translateX(-5%) scale(1.02,.94)}
#heroArt[data-pose=windup] img.photo{transform:rotate(-13deg) translateX(-6%)}
#heroArt[data-pose=beam] img.photo,#heroArt[data-pose=cross] img.photo,#heroArt[data-pose=L] img.photo,#heroArt[data-pose=T] img.photo,#heroArt[data-pose=head] img.photo{animation:pCharge .8s ease-out both}
#heroArt[data-pose=win] img.photo{animation:pWin .55s ease-in-out infinite alternate}
@keyframes pPunch{0%{transform:rotate(-8deg) translateX(-6%) scale(.98,1.02)}45%{transform:rotate(14deg) translateX(11%) scale(1.06,.97)}100%{transform:rotate(9deg) translateX(7%)}}
@keyframes pKick{0%{transform:rotate(7deg) translate(-3%,0)}45%{transform:rotate(-17deg) translate(11%,-7%) scale(1.04)}100%{transform:rotate(-12deg) translate(8%,-3%)}}
@keyframes pCharge{0%{transform:rotate(-5deg) translateX(-3%) scale(1.02,.96)}55%{transform:rotate(-3deg) translateX(-2%) scale(1.04,.97)}100%{transform:rotate(5deg) translateX(3%) scale(1.03)}}
@keyframes pWin{from{transform:translateY(0) scale(1)}to{transform:translateY(-8%) scale(1.04)}}
.pick.rival{border-color:#FF5A4E;box-shadow:0 0 18px rgba(255,90,78,.6)}
.badge.rv{background:#E3262E!important;color:#FFFFFF!important}
.pick .pa img{height:100%;width:100%;object-fit:contain;object-position:50% 100%}
.jt,.whole{transform-box:view-box;transition:transform .13s cubic-bezier(.3,1.5,.5,1)}
svg.rig{overflow:visible}
.flip{position:relative}
.pl{position:absolute;inset:0}
#hero[data-photo] .flip{transform:none}
#hero[data-photo].idle .flip{animation:breatheP 2.4s ease-in-out infinite}
#hero[data-photo].hurt .flip{animation:hurtP .5s}
@keyframes breatheP{0%,100%{transform:translateY(0)}50%{transform:translateY(-1%)}}
@keyframes hurtP{0%{transform:none}30%{transform:translateX(-14%) rotate(-8deg);filter:brightness(1.8)}100%{transform:none}}
.shadow{position:absolute;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);z-index:2;pointer-events:none}
#hero{transition:transform .14s cubic-bezier(.3,1.6,.5,1)}
#hero .flip{width:100%;height:100%;transform:scaleX(-1)}
#hero.idle .flip{animation:breathe 2.4s ease-in-out infinite}
#monster.idle .mbody{animation:mbreathe 2.8s ease-in-out infinite}
.mbody{width:100%;height:100%;transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:scaleX(-1) translateY(0)}50%{transform:scaleX(-1) translateY(-1%)}}
@keyframes mbreathe{0%,100%{transform:scale(1,1) rotate(0)}50%{transform:scale(1.01,1.02) rotate(-.6deg)}}
#monster.charge .mbody{filter:drop-shadow(0 0 18px rgba(255,60,30,.95)) brightness(1.15)}
#monster.flinch .mbody{animation:flinch .28s}
@keyframes flinch{0%{transform:translateX(0);filter:brightness(2.2)}40%{transform:translateX(5%) rotate(3deg)}100%{transform:translateX(0)}}
#monster.dizzy .mbody{animation:dizzy 1.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes dizzy{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
#hero.hurt .flip{animation:hurt .5s}
@keyframes hurt{0%{transform:scaleX(-1)}30%{transform:scaleX(-1) translateX(14%) rotate(8deg);filter:brightness(1.8)}100%{transform:scaleX(-1)}}
.warnmark{position:absolute;z-index:5;font-family:var(--display);font-size:clamp(40px,8vh,80px);color:#FFD447;text-shadow:0 0 18px #FF3B30,0 4px 0 #000;animation:warn .4s ease-in-out infinite alternate;pointer-events:none}
@keyframes warn{from{transform:scale(.9)}to{transform:scale(1.15)}}
.stars{position:absolute;z-index:5;pointer-events:none;font-size:clamp(20px,4vh,34px);animation:spinstars 1.2s linear infinite}
@keyframes spinstars{to{transform:rotate(360deg)}}
.shield{position:absolute;z-index:4;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(120,230,255,.05) 40%,rgba(120,230,255,.35) 62%,rgba(200,250,255,.9) 70%,rgba(120,230,255,0) 74%);
  box-shadow:0 0 40px rgba(94,220,255,.7);animation:shieldOn .18s ease-out}
@keyframes shieldOn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;z-index:8;display:flex;align-items:center;gap:10px;
  padding-top:max(10px, calc(env(safe-area-inset-top, 0px) + 6px));padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px))}
.hbtn{width:50px;height:50px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.hbtn svg{width:26px;height:26px}
.bar{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.bar .track{flex:1;height:16px;border-radius:9px;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.5);overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .25s}
#hhp i{background:linear-gradient(90deg,#1FA75A,#5EE08F,#D9FFE6);box-shadow:0 0 12px #5EE08F;transition:width .3s,background .3s}
#hhp.low i{background:linear-gradient(90deg,#B01208,#FF5A4E);box-shadow:0 0 12px #FF3B30}
#hhp svg{width:22px;height:22px;flex-shrink:0}
#ctimer.off{background:radial-gradient(circle at 38% 32%,#6B7385,#2B3040);box-shadow:none;animation:none}
#mhp i{background:linear-gradient(90deg,#FFB03B,#FF3B30);margin-left:auto}
#mhp .track{display:flex}
.bar .ic{font-size:20px;flex-shrink:0}
#ctimer{width:54px;height:54px;border-radius:50%;flex-shrink:0;border:4px solid #C9D1E0;background:radial-gradient(circle at 38% 32%,#F0FEFF,#63DEFF 45%,#0F7FC6);box-shadow:0 0 18px #5EDCFF,inset 0 -4px 0 rgba(0,0,0,.25)}
#ctimer.red{background:radial-gradient(circle at 38% 32%,#FFE1DE,#FF5A4E 45%,#B01208);box-shadow:0 0 22px #FF3B30;animation:blinkT .5s steps(2) infinite}
@keyframes blinkT{50%{filter:brightness(.45)}}

/* 三个按钮都放在奥特曼这一侧（左下角）：上面防御，下面出拳和光线；怪兽那边不放按钮 */
.controls{position:absolute;left:0;bottom:0;z-index:8;display:grid;grid-template-areas:"shield ." "punch beam";align-items:end;justify-items:center;gap:14px 18px;
  padding-bottom:max(14px, calc(env(safe-area-inset-bottom, 0px) + 8px));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.cbtn{position:relative;width:clamp(78px,22vw,104px);height:clamp(78px,22vw,104px);border-radius:50%;border:3px solid rgba(255,255,255,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0;
  font-family:var(--display);font-size:clamp(12px,3.2vw,15px);line-height:1;color:#FFFFFF;text-shadow:0 2px 0 rgba(0,0,0,.6);
  box-shadow:inset 0 -9px 14px rgba(0,0,0,.42),inset 0 6px 10px rgba(255,255,255,.35),0 6px 0 rgba(0,0,0,.5),0 0 18px var(--glow,rgba(0,0,0,.4))}
.cbtn::before{content:"";position:absolute;left:14%;right:14%;top:5%;height:36%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0));pointer-events:none}
.cbtn svg{width:66%;height:auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45));position:relative}
.cbtn span{position:relative;margin-top:-2px}
.cbtn:active{transform:translateY(4px);box-shadow:inset 0 -6px 10px rgba(0,0,0,.42),inset 0 4px 8px rgba(255,255,255,.3),0 2px 0 rgba(0,0,0,.5)}
#bPunch{--glow:rgba(255,90,70,.55);background:radial-gradient(circle at 38% 26%,#FF9A8C,#D4222A 52%,#6E0A10)}
#bShield{--glow:rgba(94,200,255,.55);background:radial-gradient(circle at 38% 26%,#B6ECFF,#2B7FD4 52%,#0B2E6B)}
#bBeam{--glow:rgba(255,212,71,.6);background:radial-gradient(circle at 38% 26%,#FFF7C8,#EDA211 52%,#7A4300);width:clamp(92px,26vw,124px);height:clamp(92px,26vw,124px)}
#bBeam[disabled]{background:radial-gradient(circle at 38% 26%,#B9BEC8,#6B7385 52%,#2B3040)}
#bBeam[disabled] svg{filter:grayscale(.85) brightness(.75) drop-shadow(0 2px 2px rgba(0,0,0,.45))}
/* 能量环：绕着光线按钮一圈，攒多少亮多少 */
#bBeam::after{content:"";position:absolute;inset:-9px;border-radius:50%;pointer-events:none;
  background:conic-gradient(from -90deg,var(--ec,#5EDCFF) calc(var(--e,0)*360deg),rgba(255,255,255,.2) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
  filter:drop-shadow(0 0 6px var(--ec,#5EDCFF))}
.cbtn span.small{font-size:clamp(11px,2.8vw,13px)} .cbtn span.tiny{font-size:clamp(9px,2.3vw,11px);letter-spacing:-.03em}
.cbtn span{white-space:nowrap}
#bShield.alert{animation:alertS .32s ease-in-out infinite alternate}
@keyframes alertS{from{transform:scale(1);box-shadow:inset 0 -9px 14px rgba(0,0,0,.42),inset 0 6px 10px rgba(255,255,255,.35),0 6px 0 rgba(0,0,0,.5),0 0 10px 2px rgba(255,60,48,.7)}to{transform:scale(1.14);box-shadow:inset 0 -9px 14px rgba(0,0,0,.42),inset 0 6px 10px rgba(255,255,255,.35),0 6px 0 rgba(0,0,0,.5),0 0 34px 12px rgba(255,60,48,.95)}}
#bBeam.ready{animation:ready .7s ease-in-out infinite alternate}
@keyframes ready{from{box-shadow:0 6px 0 rgba(0,0,0,.45),0 0 10px #FFD447}to{box-shadow:0 6px 0 rgba(0,0,0,.45),0 0 44px 10px #FFE066}}
.cbtn[disabled]{cursor:default}
#bShield.cool{filter:brightness(.6)}

/* 全屏层 */
.layer{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:clamp(10px,2.4vh,22px);text-align:center;
  background:radial-gradient(ellipse at 50% 30%,#2A2D5C,#0A0E1F 70%);
  padding-top:max(16px, env(safe-area-inset-top, 0px));padding-bottom:max(16px, env(safe-area-inset-bottom, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));overflow-y:auto}
.layer>:first-child{margin-top:auto}.layer>:last-child{margin-bottom:auto}
.ttl{font-family:var(--display);font-size:clamp(40px,10vw,76px);line-height:1.05;color:#FFFFFF;text-shadow:0 0 24px rgba(94,220,255,.8),0 6px 0 #B01208;text-wrap:balance}
.sub{font-size:clamp(16px,4.2vw,21px);color:var(--muted);font-weight:600}
.big{height:84px;padding:0 44px;border-radius:999px;border:4px solid #FFFFFF;background:linear-gradient(#FF5A4E,#B01208);color:#FFFFFF;font-family:var(--display);font-size:clamp(30px,8vw,42px);box-shadow:0 8px 0 #5E0A06,0 0 30px rgba(255,59,48,.5)}
.big:active{transform:translateY(5px);box-shadow:0 3px 0 #5E0A06}
.big.alt{background:linear-gradient(#5EDCFF,#1468C8);box-shadow:0 8px 0 #0A3A73}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:min(100%,760px)}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (orientation:landscape){
  #monGrid,#bookGrid{grid-template-columns:repeat(6,minmax(0,1fr))!important;width:min(100%,960px)}
  #heroGrid{grid-template-columns:repeat(6,minmax(0,1fr));width:min(100%,960px)}
  .pick .pa{aspect-ratio:1/1;max-height:20vh}
  .layer .ttl{font-size:clamp(24px,7vh,44px)!important}
  #title .ttl{font-size:clamp(30px,11vh,58px)!important}
  #title .ttl br{display:none}
  #titleArt{height:48vh!important}
  #title .sub{display:none}
  #startBtn{height:62px;font-size:28px}
  .layer{gap:10px}
}
.pick{position:relative;border:3px solid rgba(255,255,255,.35);border-radius:18px;background:radial-gradient(ellipse at 50% 40%,#3B4590,#121636 75%);padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;overflow:hidden}
.pick.on{border-color:#FFD447;box-shadow:0 0 22px rgba(255,212,71,.6)}
.pick:active{transform:scale(.96)}
.pick .pa{width:100%;aspect-ratio:3/4;display:flex;align-items:flex-end;justify-content:center}
.pick .pa svg{height:100%;width:auto;max-width:100%}
.pick .pn{font-family:var(--display);font-size:clamp(16px,4.4vw,22px);color:#FFFFFF;white-space:nowrap}
.pick.locked .pa{filter:brightness(0) opacity(.55)}
.pick .badge{position:absolute;top:6px;right:6px;font-size:12px;font-weight:700;background:#FFD447;color:#1B2246;border-radius:999px;padding:2px 8px}
.pick .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:54px;color:rgba(255,255,255,.55)}
#win{background:radial-gradient(ellipse at 50% 35%,rgba(42,45,92,.92),rgba(5,7,15,.96) 75%)}
.wincard{width:min(70vw,44vh,320px);aspect-ratio:3/4;border-radius:22px;padding:10px;background:linear-gradient(135deg,#FFF9CF,#E8A80C 36%,#FFFDE8 50%,#B8730A 74%,#FFE47A);box-shadow:0 0 50px rgba(255,212,71,.5)}
.wincard .in{width:100%;height:100%;border-radius:14px;background:radial-gradient(ellipse at 50% 40%,#5A2B12,#140806 75%);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.wincard svg{height:92%;width:auto;max-width:100%}
.wname{font-family:var(--display);font-size:clamp(30px,8vw,46px);color:#FFFFFF}
.wintro{max-width:30em;font-size:clamp(15px,4vw,18px);line-height:1.6;color:#E6EBFF;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 14px;text-align:left}
.winwrap{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,18px);width:100%}
.wininfo{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vh,14px);min-width:0}
@media (orientation:landscape){
  .winwrap{flex-direction:row;justify-content:center;gap:28px}
  .wincard{width:auto;height:min(78vh,420px)}
  .wininfo .ttl{font-size:clamp(30px,9vh,52px)!important}
  .wintro{font-size:15px;max-width:26em}
}
.movecap{position:absolute;left:50%;top:16%;transform:translateX(-50%);z-index:7;pointer-events:none;white-space:nowrap;font-family:var(--display);font-size:clamp(30px,9vh,64px);animation:movecap 2.3s ease-out both}
@keyframes movecap{0%{opacity:0;transform:translateX(-50%) scale(1.8)}12%{opacity:1;transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#flash{position:fixed;inset:0;z-index:15;background:#FFFFFF;opacity:0;pointer-events:none}
#flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
#rotateTip{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:7;font-size:14px;color:var(--muted);background:var(--panel);border-radius:999px;padding:6px 14px;white-space:nowrap}
@media (orientation:landscape){#rotateTip{display:none}}
@media (orientation:landscape){
  .cbtn{width:clamp(76px,24vh,104px);height:clamp(76px,24vh,104px);opacity:.95}
  #bBeam{width:clamp(88px,28vh,120px);height:clamp(88px,28vh,120px)}
  .controls{gap:14px 18px}
}
.controls .rgt{display:contents}
#bShield{grid-area:shield} #bPunch{grid-area:punch} #bBeam{grid-area:beam}
@media (prefers-reduced-motion: reduce){#hero.idle .flip,#monster.idle .mbody,#bBeam.ready,#ctimer.red{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <canvas id="bg"></canvas>
    <div class="shadow" id="hshadow"></div><div class="shadow" id="mshadow"></div>
    <div class="actor" id="hero"><div class="flip" id="heroArt"></div></div>
    <div class="actor" id="monster"><div class="mbody" id="monArt"></div></div>
    <canvas id="fx"></canvas>
  </div>
  <canvas id="grain"></canvas>
  <div class="vignette"></div>
  <div class="bars" style="position:absolute;inset:0;pointer-events:none"></div>
  <div class="hud" id="hud" hidden>
    <button class="hbtn" id="homeBtn" aria-label="返回"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z" fill="#FFFFFF"/></svg></button>
    <div class="bar" id="hhp" aria-label="奥特曼的血"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21 C5 15 2 11.5 2 7.8 C2 4.8 4.3 3 6.8 3 C8.8 3 10.6 4 12 6 C13.4 4 15.2 3 17.2 3 C19.7 3 22 4.8 22 7.8 C22 11.5 19 15 12 21 Z" fill="#FF4A4A" stroke="#FFFFFF" stroke-width="1.6"/></svg><div class="track"><i></i></div></div>
    <div id="ctimer" aria-label="彩色计时器"></div>
    <div class="bar" id="mhp"><div class="track"><i></i></div><span class="ic">👾</span></div>
  </div>
  <div id="rotateTip" hidden>横过来玩更像电视哦</div>
  <div class="controls" id="controls" hidden>
    <button class="cbtn" id="bShield" aria-label="防御">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <radialGradient id="lsA" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#E8FDFF" stop-opacity=".35"/><stop offset=".55" stop-color="#7FE3FF" stop-opacity=".25"/><stop offset=".8" stop-color="#9FEFFF" stop-opacity=".85"/><stop offset=".92" stop-color="#FFFFFF"/><stop offset="1" stop-color="#5EDCFF" stop-opacity="0"/></radialGradient>
          <radialGradient id="lsC" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#BDF3FF" stop-opacity=".8"/><stop offset="1" stop-color="#5EDCFF" stop-opacity="0"/></radialGradient>

  const mv=MOVES[save.hero]||{name:'必杀光线',pose:'beam',kind:'beam',col:[110,195,255]}, col=mv.col.join(',');
  heroEl.classList.remove('idle'); setPose(mv.pose==='throw'?'windup':mv.pose);
  say([AUDIO['mv_'+save.hero]?'mv_'+save.hero:'f_beam']); sfx.charge(); moveCaption(mv.name+'！',col);
  slow=.45; energy=0; setBars();
  // 蓄力：光点向发射点聚拢
  const gather=setInterval(()=>{ const o=beamOrigin(mv.pose==='throw'?'tip':mv.pose); for(let i=0;i<4;i++){ const an=Math.random()*6.28, d=40+Math.random()*50; emit({t:'spark',x:o.x+Math.cos(an)*d,y:o.y+Math.sin(an)*d,vx:-Math.cos(an)*d/12,vy:-Math.sin(an)*d/12,life:0,max:12,col:`rgb(${col})`}); } },60);
  setTimeout(()=>{
    clearInterval(gather);
    if(mv.pose==='throw') setPose('thrown');
    sfx.beam(); const b=monPoint(118,140);
    setTimeout(()=>{ const a=beamOrigin(mv.pose==='throw'?'tip':mv.pose); beamFx={x1:a.x,y1:a.y,x2:b.x,y2:b.y,t:0,kind:mv.kind,col:mv.col}; shake=6; },mv.pose==='throw'?140:0);
    const absorb=current.id==='zetton'&&beams===1;
    setTimeout(()=>{
      beamFx=null; slow=1;
      if(absorb){ monEl.classList.add('charge'); sparks(b.x,b.y,'#FFD23A',40); say(['f_absorb']); setTimeout(()=>{ monEl.classList.remove('charge'); setHero('stand'); heroEl.classList.add('idle'); busy=false; hp=Math.max(hp,.35); monEl.classList.remove('dizzy'); saidFull=false; setBars(); scheduleAttack(3000); },2400); return; }
      victory(b);
    },1700);
  },800);
}
function victory(b){
  inFight=false; clearInterval(beepTimer); clearMarks();
  flash(); explode(b.x,b.y,2.2); sfx.boom(); shake=34;
  setTimeout(()=>{ explode(b.x,b.y-G.mh*.2,1.6); sfx.boom(); },250);
  setTimeout(()=>{ monEl.style.transition='transform 1.4s ease-in,opacity 1.4s'; monEl.style.transform='translateY(-120%) scale(.12)'; monEl.style.opacity='0'; },500);
  setTimeout(()=>{ setHero('win'); heroEl.classList.add('idle'); sfx.fanfare(); },1300);
  const first=!save.beaten[current.id]; save.beaten[current.id]=(save.beaten[current.id]||0)+1; persist();
  setTimeout(()=>{
    $('#hud').hidden=true; $('#controls').hidden=true; $('#rotateTip').hidden=true;
    $('#winArt').innerHTML=monArt(current.id); $('#winName').textContent=current.name; $('#winIntro').textContent=current.intro; $('#win').hidden=false;
    const all=MONSTERS.every(m=>save.beaten[m.id]);
    const unlockedNew=first&&MONSTERS.findIndex(m=>m.id===current.id)<MONSTERS.length-1;
    say(['f_win','f_n_'+current.id,'f_i_'+current.id,...(all&&first?['f_allwin']:unlockedNew?['f_new']:[])]);
    monEl.style.transition=''; monEl.style.transform='';
  },3200);
}
// 奥特曼的血条清空：失败，不记图鉴，回去重新选择
function defeat(){
  inFight=false; busy=true; clearTimeout(attackTimer); clearInterval(beepTimer); clearMarks(); beamFx=null; slow=1; stopVoice();
  $('#controls').hidden=true; $('#ctimer').classList.remove('red'); $('#ctimer').classList.add('off');
  heroEl.classList.remove('idle','hurt'); setPose('stand');
  [520,400,300,220,150].forEach((f,i)=>tone(f,i*.16,.3,'triangle',.2));
  heroEl.style.transition='transform 1s cubic-bezier(.5,0,.8,.4),filter 1s'; heroEl.style.transform='rotate(-82deg) translate(-18%,6%)'; heroEl.style.filter='grayscale(.8) brightness(.6)';
  setTimeout(()=>{ sfx.stomp(); shake=16; dust(G.hx-G.hw*.4,G.groundY,G.hw*1.2); },950);
  setTimeout(()=>{ heroEl.style.transition=''; heroEl.style.transform=''; heroEl.style.filter='';
    $('#hud').hidden=true; $('#rotateTip').hidden=true; $('#loseName').textContent=current.name+' 还没有被打败'; $('#lose').hidden=false; say(['f_lose']); },2300);
}
function leaveFight(){ heroEl.style.transition=''; heroEl.style.transform=''; heroEl.style.filter=''; inFight=false; busy=false; clearTimeout(attackTimer); clearInterval(beepTimer); clearMarks(); beamFx=null; slow=1; $('#hud').hidden=true; $('#controls').hidden=true; $('#rotateTip').hidden=true; stopVoice(); }

/* ---------- 选人、选怪兽、图鉴 ---------- */
function showHeroPick(){
  leaveFight(); ['#title','#pickMonster','#book','#win','#lose'].forEach(s=>$(s).hidden=true);
  $('#heroGrid').innerHTML=HEROES.map(([id,n])=>`<button class="pick${id===save.hero?' on':''}" data-h="${id}"><div class="pa">${heroArt(id,{real:1,pose:'stand'})}</div><div class="pn">${n}</div></button>`).join('');
  $('#pickHero').hidden=false; say(['f_pickHero']);
}
function showMonPick(){
  leaveFight(); ['#title','#pickHero','#book','#win','#lose'].forEach(s=>$(s).hidden=true);
  const n=unlockedCount();
  const rv=RIVAL[save.hero]; const list=[...MONSTERS].sort((a,b)=>(b.id===rv)-(a.id===rv));
  $('#monGrid').innerHTML=list.map(m=>{ const i=MONSTERS.indexOf(m), isR=m.id===rv, lock=i>=n&&!isR; return `<button class="pick${lock?' locked':''}${isR?' rival':''}" data-m="${m.id}" data-lock="${lock?1:''}"><div class="pa">${monArt(m.id)}</div><div class="pn">${lock?'？？？':m.name}</div>${isR?'<span class="badge rv">宿敌</span>':save.beaten[m.id]?'<span class="badge">打败过</span>':''}${lock?'<div class="q">?</div>':''}</button>`; }).join('');
  $('#pickMonster').hidden=false; say(['f_pickMonster']);
}
function showBook(){
  ['#pickMonster','#win'].forEach(s=>$(s).hidden=true);
  $('#bookGrid').innerHTML=MONSTERS.map(m=>{ const got=save.beaten[m.id]; return `<button class="pick${got?'':' locked'}" data-b="${m.id}"><div class="pa">${monArt(m.id)}</div><div class="pn">${got?m.name:'？？？'}</div>${got?`<span class="badge">×${got}</span>`:'<div class="q">?</div>'}</button>`; }).join('');
  $('#bookIntro').hidden=true; $('#book').hidden=false; say(['f_book']);
}
$('#heroGrid').addEventListener('click',e=>{ const b=e.target.closest('[data-h]'); if(!b) return; sfx.tap(); save.hero=b.dataset.h; persist(); say(['n_'+save.hero]); setTimeout(showMonPick,900); });
$('#monGrid').addEventListener('click',e=>{ const b=e.target.closest('[data-m]'); if(!b) return; if(b.dataset.lock){ sfx.tap(); say(['f_locked']); return; } sfx.tap(); startFight(MONSTERS.find(m=>m.id===b.dataset.m)); });
$('#bookGrid').addEventListener('click',e=>{ const b=e.target.closest('[data-b]'); if(!b) return; const m=MONSTERS.find(x=>x.id===b.dataset.b); if(!save.beaten[m.id]){ say(['f_locked']); return; } $('#bookIntro').textContent=m.intro; $('#bookIntro').hidden=false; say(['f_n_'+m.id,'f_i_'+m.id]); });
$('#toHero').addEventListener('click',()=>{ sfx.tap(); showHeroPick(); });
$('#toBook').addEventListener('click',()=>{ sfx.tap(); showBook(); });
$('#bookBack').addEventListener('click',()=>{ sfx.tap(); showMonPick(); });
$('#retryBtn').addEventListener('click',()=>{ sfx.tap(); showHeroPick(); });
$('#againBtn').addEventListener('click',()=>{ sfx.tap(); showMonPick(); });
$('#winBook').addEventListener('click',()=>{ sfx.tap(); showBook(); });
$('#homeBtn').addEventListener('click',()=>{ sfx.tap(); showMonPick(); });
$('#bPunch').addEventListener('click',punch);
$('#bShield').addEventListener('click',shieldUp);
$('#bBeam').addEventListener('click',fireBeam);
monEl.addEventListener('click',punch);
document.addEventListener('keydown',e=>{ if(!inFight) return; if(e.key==='j'||e.key==='ArrowRight') punch(); if(e.key==='k'||e.key==='ArrowDown') shieldUp(); if(e.key===' '||e.key==='l') fireBeam(); });
$('#startBtn').addEventListener('click',()=>{
  audio(); try{ if(AUDIO.f_hello){ player.src=AUDIO.f_hello; const pp=player.play(); if(pp&&pp.catch) pp.catch(()=>{}); } }catch(e){}
  warm(['f_pickHero','f_pickMonster','f_locked','f_henshin',...HEROES.map(h=>'n_'+h[0])]);
  sfx.henshin(); $('#title').hidden=true; CLIP.f_hello={url:AUDIO.f_hello,p:Promise.resolve(AUDIO.f_hello)};
  setTimeout(showHeroPick,1800);
});
// 主页：随机一位有下载图的奥特曼和他的宿敌面对面；没有下载图的版本用手绘迪迦，不用玩具照片
(function(){
  const refs=HEROES.map(h=>h[0]).filter(id=>IMG.h[id]&&IMG.h[id].dl&&RIVAL[id]&&IMG.m[RIVAL[id]]&&!['gransphere','zesu','megalothor'].includes(RIVAL[id]));
  const hid=refs.length?refs[Math.floor(Math.random()*refs.length)]:'tiga';
  const mid=(RIVAL[hid]&&MONSTERS.some(m=>m.id===RIVAL[hid]))?RIVAL[hid]:MONSTERS[0].id;
  const st='style="height:100%;width:auto;max-width:min(42vw,52vh);object-fit:contain;object-position:50% 100%"';
  const h=refs.length?photoTag(IMG.h[hid]):heroSVG(hid,{real:1,pose:'beam',noFx:1});
  $('#titleArt').innerHTML=[h,monArt(mid)].map(x=>x.replace(/^<(svg|img)/,'<$1 '+st)).join('');
})();
addEventListener('resize',()=>layout());
layout(); requestAnimationFrame(loop); if(!reduce) requestAnimationFrame(grainLoop);
window.__defeatTest=()=>{ heroHp=1/HERO_HITS; };
window.__fight={startFight,MONSTERS,save,punch,fireBeam,shieldUp,monsterAttack,setPose,rigSVG,applyRig,IMG,heroSVG};
})();
</script>
